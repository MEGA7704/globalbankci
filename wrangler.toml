name = "global-bank"
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"

# Variable non sensible, chargée automatiquement dans env.SUPER_ADMIN_SESSION_VERSION.
# Incrémentez cette valeur après chaque changement du mot de passe Super Admin
# pour invalider toutes les sessions précédentes.
[vars]
SUPER_ADMIN_SESSION_VERSION = "1"

# Les noms sont déclarés ici, mais jamais leurs valeurs.
# Wrangler exigera que ces secrets chiffrés existent dans Cloudflare.
[secrets]
required = ["SUPER_ADMIN_LOGIN", "SUPER_ADMIN_PASSWORD"]

[[d1_databases]]
binding = "DB"
database_name = "bankdb"
database_id = "692edd7a-98d5-484a-aa75-5a86a9107c16"

[[kv_namespaces]]
binding = "KV"
id = "f02b47264a8c411aa61052c45a3bb72a"
